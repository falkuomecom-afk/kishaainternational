<div class="card">
  <div class="body" style="text-align:center;padding:48px 24px">
    <div style="font-size:2.6rem;font-weight:800;letter-spacing:-.03em;color:var(--a-teal-700)">{{default status 500}}</div>
    <h1 style="margin-top:6px">{{default title 'Something went wrong'}}</h1>
    <p class="muted" style="max-width:52ch;margin:6px auto 18px">{{default message 'The action could not be completed.'}}</p>
    <div class="row" style="justify-content:center">
      <a class="btn primary" href="/admin">Back to dashboard</a>
      <a class="btn" href="javascript:history.back()">Go back</a>
    </div>
  </div>
</div>
